
name: DataOps Sentinel - Scheduled Dashboard Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

concurrency:
  group: dataops-sentinel-refresh-check
  cancel-in-progress: false

jobs:
  check-refresh:
    name: Check for New Banking Data

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3 pytest

      - name: Run refresh detection tests
        run: |
          python -m pytest tests/test_dashboard_refresh.py -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_GOLD_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
          allowed-account-ids: "833090648467"

      - name: Check published reporting quarters
        id: refresh
        run: |
          python -m src.pipeline.check_dashboard_refresh --check

      - name: Report refresh status
        run: |
          if [ "${{ steps.refresh.outputs.needs_refresh }}" = "true" ]; then
            echo "New processed data detected."
            echo "Automatic publication is not enabled yet."
          else
            echo "Dashboard snapshots are current."
          fi
