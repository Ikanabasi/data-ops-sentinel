
name: DataOps Sentinel - Dashboard Snapshot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Snapshot operation"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - publish

permissions:
  contents: read

concurrency:
  group: dataops-sentinel-dashboard-publisher
  cancel-in-progress: false

jobs:
  dashboard-snapshot:
    name: Validate and Publish Snapshot

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest boto3 sqlglot

      - name: Run snapshot tests
        run: |
          python -m pytest tests/test_dashboard_snapshot.py -v

      - name: Display snapshot plan
        run: |
          python -m src.pipeline.publish_dashboard_snapshot --plan

      - name: Configure AWS credentials
        if: inputs.mode == 'publish'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_GOLD_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
          allowed-account-ids: "833090648467"

      - name: Verify AWS identity
        if: inputs.mode == 'publish'
        run: aws sts get-caller-identity

      - name: Publish validated dashboard snapshot
        if: inputs.mode == 'publish'
        run: |
          python -m src.pipeline.publish_dashboard_snapshot --publish
