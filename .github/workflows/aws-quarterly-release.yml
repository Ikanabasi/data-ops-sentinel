
name: DataOps Sentinel - Final Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataops-sentinel-final-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Validate DataOps Sentinel v1.0
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest boto3 pyarrow sqlglot

      - name: Run full automated test suite
        run: |
          python -m pytest -v

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_GOLD_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
          allowed-account-ids: "833090648467"

      - name: Check FDIC availability
        run: |
          python -m src.pipeline.check_fdic_new_quarter --check

      - name: Verify quarterly ingestion plan
        run: |
          python -m src.pipeline.run_one_quarter --plan

      - name: Check partition registration configuration
        run: |
          python -m src.pipeline.register_athena_partition --plan

      - name: Check Gold validation configuration
        run: |
          python -m src.pipeline.check_gold_readiness --plan

      - name: Final release summary
        run: |
          echo "DataOps Sentinel v1.0 verification passed."
          echo "Automated tests: PASSED"
          echo "FDIC availability: CHECKED"
          echo "Quarterly ingestion: PLANNED"
          echo "Partition registration: CONFIGURATION CHECKED"
          echo "Gold readiness: CONFIGURATION CHECKED"
          echo "No AWS data was modified."
